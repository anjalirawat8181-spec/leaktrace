name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck --workspace @leaktrace/api
      - run: npm run typecheck --workspace @leaktrace/worker
      - run: npm run build --workspace @leaktrace/web
      - run: npm run db:up
      - run: npm run db:test
      - run: npm test
      - run: npm run e2e
