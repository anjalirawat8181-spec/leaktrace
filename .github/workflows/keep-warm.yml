name: Keep API warm

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 "${API_URL}/api/health"
